<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">RedCall Live Translate side panel preview</title>
  <desc id="desc">Login and active translation states of the Chrome extension side panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b3c"/>
      <stop offset="1" stop-color="#12315f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#021027" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="82" r="180" fill="#ff3f4a" opacity=".08"/>
  <circle cx="130" cy="630" r="230" fill="#6ea8ff" opacity=".08"/>

  <text x="72" y="85" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">Real-time translation, inside Chrome</text>
  <text x="72" y="119" fill="#a9bad7" font-family="Inter,Segoe UI,sans-serif" font-size="17">Manifest V3 · WebRTC · LiveKit · Web Audio · PKCE</text>

  <g transform="translate(110 160)" filter="url(#shadow)">
    <rect width="390" height="450" rx="18" fill="#f5f7fb"/>
    <path d="M0 18A18 18 0 0 1 18 0h354a18 18 0 0 1 18 18v58H0Z" fill="#071b3c"/>
    <rect y="74" width="390" height="2" fill="#ff3f4a"/>
    <circle cx="35" cy="36" r="14" fill="none" stroke="#ff3f4a" stroke-width="7" stroke-dasharray="63 25"/>
    <text x="58" y="34" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">RedCall</text>
    <text x="58" y="51" fill="#9fb1d0" font-family="Inter,Segoe UI,sans-serif" font-size="10" letter-spacing="1.2">LIVE TRANSLATE</text>
    <rect x="290" y="25" width="78" height="24" rx="12" fill="#12315f"/>
    <text x="329" y="41" text-anchor="middle" fill="#dce9ff" font-family="Inter,Segoe UI,sans-serif" font-size="9">SIGNED OUT</text>

    <rect x="18" y="96" width="354" height="313" rx="15" fill="#ffffff" stroke="#dae2ef"/>
    <text x="42" y="136" fill="#ff3f4a" font-family="Inter,Segoe UI,sans-serif" font-size="10" font-weight="800" letter-spacing="1.3">OPENAI REALTIME</text>
    <text x="42" y="177" fill="#0b1b3b" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">Real-time translation</text>
    <text x="42" y="212" fill="#62708a" font-family="Inter,Segoe UI,sans-serif" font-size="14">Connect your RedCall account, then choose</text>
    <text x="42" y="233" fill="#62708a" font-family="Inter,Segoe UI,sans-serif" font-size="14">the tab you want to translate.</text>
    <rect x="42" y="267" width="306" height="48" rx="10" fill="#ff3f4a"/>
    <text x="195" y="297" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Connect to RedCall</text>
    <path d="M42 344h306" stroke="#e3e8f0"/>
    <text x="195" y="372" text-anchor="middle" fill="#62708a" font-family="Inter,Segoe UI,sans-serif" font-size="11">Secure PKCE login · no password stored in Chrome</text>
  </g>

  <g transform="translate(700 130)" filter="url(#shadow)">
    <rect width="390" height="510" rx="18" fill="#f5f7fb"/>
    <path d="M0 18A18 18 0 0 1 18 0h354a18 18 0 0 1 18 18v58H0Z" fill="#071b3c"/>
    <rect y="74" width="390" height="2" fill="#ff3f4a"/>
    <circle cx="35" cy="36" r="14" fill="none" stroke="#ff3f4a" stroke-width="7" stroke-dasharray="63 25"/>
    <text x="58" y="34" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">RedCall</text>
    <text x="58" y="51" fill="#9fb1d0" font-family="Inter,Segoe UI,sans-serif" font-size="10" letter-spacing="1.2">LIVE TRANSLATE</text>
    <rect x="284" y="25" width="84" height="24" rx="12" fill="#12315f"/>
    <text x="326" y="41" text-anchor="middle" fill="#dce9ff" font-family="Inter,Segoe UI,sans-serif" font-size="9">CONNECTED</text>

    <rect x="16" y="91" width="358" height="70" rx="14" fill="#ffffff" stroke="#dae2ef"/>
    <circle cx="38" cy="118" r="6" fill="#19ab64"/>
    <circle cx="38" cy="118" r="11" fill="none" stroke="#19ab64" opacity=".2" stroke-width="5"/>
    <text x="55" y="120" fill="#0b1b3b" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Translation active</text>
    <text x="30" y="145" fill="#62708a" font-family="Inter,Segoe UI,sans-serif" font-size="11">Translated audio is streaming in real time.</text>

    <rect x="16" y="175" width="358" height="247" rx="14" fill="#ffffff" stroke="#dae2ef"/>
    <text x="31" y="205" fill="#172947" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">MODE</text>
    <rect x="30" y="217" width="330" height="58" rx="10" fill="#ffffff" stroke="#ccd6e5"/>
    <path d="M195 217v58" stroke="#ccd6e5"/>
    <rect x="195" y="217" width="165" height="58" rx="10" fill="#fff1f2"/>
    <rect x="195" y="272" width="165" height="3" fill="#ff3f4a"/>
    <text x="112" y="244" text-anchor="middle" fill="#172947" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Listen</text>
    <text x="278" y="244" text-anchor="middle" fill="#d92e3b" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Two-way</text>
    <text x="112" y="261" text-anchor="middle" fill="#718098" font-family="Inter,Segoe UI,sans-serif" font-size="9">ANY AUDIO TAB</text>
    <text x="278" y="261" text-anchor="middle" fill="#718098" font-family="Inter,Segoe UI,sans-serif" font-size="9">MEET · ZOOM · TELEGRAM</text>

    <text x="31" y="305" fill="#172947" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">HEARD LANGUAGE</text>
    <text x="204" y="305" fill="#172947" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">MY LANGUAGE</text>
    <rect x="30" y="314" width="154" height="39" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="203" y="314" width="157" height="39" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="45" y="339" fill="#0b1b3b" font-family="Inter,Segoe UI,sans-serif" font-size="12">English</text>
    <text x="218" y="339" fill="#0b1b3b" font-family="Inter,Segoe UI,sans-serif" font-size="12">French</text>
    <text x="31" y="380" fill="#172947" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">ORIGINAL AUDIO</text>
    <path d="M31 398h329" stroke="#d3dbe7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="31" cy="398" r="7" fill="#ff3f4a"/>

    <rect x="16" y="438" width="358" height="48" rx="10" fill="#0b1b3b"/>
    <text x="195" y="468" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Stop and restore microphone</text>
  </g>
</svg>
